<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Namahage Consult Admin / KYOUKAI</title>
  <link rel="stylesheet" href="/static/namahage-avatar-consult-admin.css?v=2">
</head>
<body>
  <main class="consult-admin">
    <header class="consult-admin__header">
      <h1>相談カード</h1>
      <span id="consultQueueCount">待機 0件</span>
    </header>
    <label>出典・URL<input id="consultSource" type="text" maxlength="120" placeholder="URLまたは出典名"></label>
    <label>タイトル<input id="consultTitle" type="text" maxlength="80" placeholder="匿名化した相談タイトル"></label>
    <label>相談要約<textarea id="consultSummary" rows="5" maxlength="360" placeholder="個人名・ID・固有情報を消した要約"></textarea></label>
    <label>AI判定<textarea id="consultAnswer" rows="6" maxlength="520" placeholder="AIが出した回答"></textarea></label>
    <label>なまはげ判定まとめ<textarea id="consultNamahage" rows="5" maxlength="420" placeholder="なまはげとして締める判定・一言まとめ"></textarea></label>
    <div class="consult-admin__buttons">
      <button id="consultShow" type="button">表示</button>
      <button id="consultEnqueue" type="button">待機列に追加</button>
      <button id="consultNext" type="button">次の相談</button>
      <button id="consultHide" type="button">隠す</button>
      <button id="consultSample" class="consult-admin__sample" type="button">例を入力</button>
    </div>
    <p id="consultStatus">待機中</p>
  </main>
  <script defer src="/static/namahage-avatar-consult-admin.js?v=3"></script>
</body>
</html>
